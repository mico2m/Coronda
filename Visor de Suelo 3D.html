<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Visor de Suelo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* Layout: escena 3D a pantalla completa, panel de suelo flotante arriba a la izquierda, ayuda de controles abajo. */
  :root {
    --bg: #eef1f2;
    --scene: #c9d4d9;
    --panel: rgba(250, 252, 252, 0.92);
    --fg: #172023;
    --muted: #5b6b70;
    --line: #cdd7da;
    --accent: #0f766e;
    --accent-fg: #ffffff;
    --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101517;
      --scene: #151b1e;
      --panel: rgba(22, 29, 32, 0.92);
      --fg: #e6edef;
      --muted: #93a4a9;
      --line: #2c3a3f;
      --accent: #2dd4bf;
      --accent-fg: #06201c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101517;
    --scene: #151b1e;
    --panel: rgba(22, 29, 32, 0.92);
    --fg: #e6edef;
    --muted: #93a4a9;
    --line: #2c3a3f;
    --accent: #2dd4bf;
    --accent-fg: #06201c;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; overflow: hidden; }

  .app { position: relative; height: 100%; width: 100%; }
  #stage { position: absolute; inset: 0; touch-action: none; cursor: grab; background: var(--scene); }
  #stage.dragging { cursor: grabbing; }
  #stage canvas { display: block; }

  .panel {
    position: absolute; top: 12px; left: 12px; z-index: 2;
    width: 296px; max-width: calc(100% - 24px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; }
  .panel-head h1 { margin: 0; font: 600 16px/1.2 var(--font-display); letter-spacing: 0.01em; }
  .panel-body { padding: 4px 12px 12px; display: grid; gap: 14px; max-height: min(70vh, 560px); overflow-y: auto; }
  .panel-body[hidden] { display: none; }

  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; min-width: 0; }
  legend { padding: 0; margin-bottom: 8px; font: 600 11px/1 var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

  .row { display: grid; gap: 4px; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .row label { font-weight: 500; }
  .row output { font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }

  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button, .filebtn {
    font: 500 13px/1 var(--font-body); color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; cursor: pointer;
  }
  button:hover, .filebtn:hover { border-color: var(--accent); }
  .primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .primary:hover { filter: brightness(1.06); }
  .filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .filebtn:focus-within, button:focus-visible, input[type="range"]:focus-visible, .check input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filebtn { position: relative; display: inline-block; }
  .status { margin: 0; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .check input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

  .hint {
    position: absolute; left: 12px; bottom: 12px; z-index: 1; max-width: calc(100% - 24px);
    padding: 8px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
    color: var(--muted); font-size: 12px; line-height: 1.5;
  }
  .hint kbd { font: 600 11px var(--font-body); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  .hint b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }

  .pad { display: none; position: absolute; right: 12px; bottom: 12px; z-index: 2; gap: 6px; grid-template-columns: repeat(3, 46px); grid-auto-rows: 46px; user-select: none; -webkit-user-select: none; }
  .pad button { padding: 0; width: 46px; height: 46px; background: var(--panel); touch-action: none; font-size: 15px; }
  @media (pointer: coarse) {
    .pad { display: grid; }
    .hint { display: none; }
  }
  @media (max-width: 520px) {
    .panel { width: auto; right: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <div id="stage" aria-label="Escena 3D"></div>

  <aside class="panel" aria-label="Ajustes del suelo">
    <div class="panel-head">
      <h1>Suelo</h1>
      <button id="toggle" type="button" aria-expanded="true" aria-controls="panelBody">Ocultar</button>
    </div>
    <div class="panel-body" id="panelBody">
      <fieldset>
        <legend>Tamaño</legend>
        <div class="row">
          <div class="row-top"><label for="sizeX">Ancho (X)</label><output id="sizeXOut" for="sizeX"></output></div>
          <input id="sizeX" type="range" min="1" max="200" step="1" value="20">
        </div>
        <div class="row">
          <div class="row-top"><label for="sizeZ">Largo (Z)</label><output id="sizeZOut" for="sizeZ"></output></div>
          <input id="sizeZ" type="range" min="1" max="200" step="1" value="20">
        </div>
      </fieldset>

      <fieldset>
        <legend>Textura</legend>
        <div class="row">
          <div class="row-top"><label for="repX">Repetir en X</label><output id="repXOut" for="repX"></output></div>
          <input id="repX" type="range" min="1" max="100" step="1" value="10">
        </div>
        <div class="row">
          <div class="row-top"><label for="repZ">Repetir en Z</label><output id="repZOut" for="repZ"></output></div>
          <input id="repZ" type="range" min="1" max="100" step="1" value="10">
        </div>
        <label class="check"><input id="linkRep" type="checkbox" checked> Mantener la misma repetición en X y Z</label>
        <div class="btns">
          <label class="filebtn primary" for="texFile">Cargar textura<input id="texFile" type="file" accept="image/png,image/jpeg,image/webp"></label>
          <button id="texReset" type="button">Textura de prueba</button>
        </div>
        <p class="status" id="status" aria-live="polite">Textura de prueba.</p>
      </fieldset>

      <fieldset>
        <legend>Vista</legend>
        <label class="check"><input id="gridOn" type="checkbox"> Mostrar cuadrícula de 1 m</label>
      </fieldset>
    </div>
  </aside>

  <div class="hint" id="hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> mover · <kbd>Espacio</kbd> subir · <kbd>Shift</kbd> bajar · arrastrar para mirar · rueda para la velocidad (<b id="speedOut">6</b> m/s)
  </div>

  <div class="pad" id="pad" aria-label="Controles táctiles">
    <button type="button" data-key="Space" aria-label="Subir">▲</button>
    <button type="button" data-key="KeyW" aria-label="Adelante">W</button>
    <button type="button" data-key="ShiftLeft" aria-label="Bajar">▼</button>
    <button type="button" data-key="KeyA" aria-label="Izquierda">A</button>
    <button type="button" data-key="KeyS" aria-label="Atrás">S</button>
    <button type="button" data-key="KeyD" aria-label="Derecha">D</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');

  /* ---------- Renderer, escena y cámara ---------- */
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xcccccc, 120, 500);
  var camera = new THREE.PerspectiveCamera(70, 1, 0.1, 2000);
  camera.rotation.order = 'YXZ';
  var yaw = 0, pitch = -0.2;
  camera.position.set(0, 1.7, 16);

  function applyTheme() {
    var c = getComputedStyle(document.documentElement).getPropertyValue('--scene').trim() || '#c9d4d9';
    scene.background = new THREE.Color(c);
    scene.fog.color = new THREE.Color(c);
  }
  applyTheme();
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', applyTheme);
  }

  /* ---------- Textura ---------- */
  var maxAniso = renderer.capabilities.getMaxAnisotropy();
  var currentTex = null;

  function configure(t) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = maxAniso;
    t.needsUpdate = true;
    return t;
  }

  function makeDefaultTexture() {
    var c = document.createElement('canvas');
    c.width = c.height = 512;
    var g = c.getContext('2d');
    var tones = ['#9aa19c', '#8a918d', '#a4aaa4', '#868d89'];
    g.fillStyle = '#6f7673';
    g.fillRect(0, 0, 512, 512);
    for (var i = 0; i < 2; i++) {
      for (var j = 0; j < 2; j++) {
        g.fillStyle = tones[i * 2 + j];
        g.fillRect(i * 256 + 5, j * 256 + 5, 246, 246);
      }
    }
    for (var n = 0; n < 2600; n++) {
      g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
      g.fillRect(Math.random() * 512, Math.random() * 512, 2 + Math.random() * 3, 2 + Math.random() * 3);
    }
    return configure(new THREE.CanvasTexture(c));
  }

  /* ---------- Suelo ---------- */
  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ side: THREE.DoubleSide })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  var grid = null;

  function setTexture(t) {
    if (currentTex) currentTex.dispose();
    currentTex = t;
    floor.material.map = t;
    floor.material.needsUpdate = true;
    updateFloor();
  }

  function val(id) { return Number(document.getElementById(id).value); }

  function updateGrid(w, d) {
    if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); grid = null; }
    if (!document.getElementById('gridOn').checked) return;
    var size = Math.max(w, d);
    grid = new THREE.GridHelper(size, size, 0x000000, 0x000000);
    grid.material.transparent = true;
    grid.material.opacity = 0.25;
    grid.position.y = 0.01;
    scene.add(grid);
  }

  function updateFloor() {
    var w = val('sizeX'), d = val('sizeZ'), rx = val('repX'), rz = val('repZ');
    floor.scale.set(w, d, 1);
    if (currentTex) currentTex.repeat.set(rx, rz);
    document.getElementById('sizeXOut').textContent = w + ' m';
    document.getElementById('sizeZOut').textContent = d + ' m';
    document.getElementById('repXOut').textContent = '×' + rx;
    document.getElementById('repZOut').textContent = '×' + rz;
    updateGrid(w, d);
  }

  /* ---------- Controles del panel ---------- */
  ['sizeX', 'sizeZ'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', updateFloor);
  });
  function onRep(from) {
    return function () {
      if (document.getElementById('linkRep').checked) {
        var other = from === 'repX' ? 'repZ' : 'repX';
        document.getElementById(other).value = document.getElementById(from).value;
      }
      updateFloor();
    };
  }
  document.getElementById('repX').addEventListener('input', onRep('repX'));
  document.getElementById('repZ').addEventListener('input', onRep('repZ'));
  document.getElementById('linkRep').addEventListener('change', function () {
    if (this.checked) { document.getElementById('repZ').value = document.getElementById('repX').value; updateFloor(); }
  });
  document.getElementById('gridOn').addEventListener('change', updateFloor);

  var status = document.getElementById('status');
  document.getElementById('texFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var url = URL.createObjectURL(file);
    status.textContent = 'Cargando ' + file.name + '…';
    new THREE.TextureLoader().load(url, function (t) {
      setTexture(configure(t));
      status.textContent = 'Textura: ' + file.name + ' (' + t.image.width + '×' + t.image.height + ' px)';
      URL.revokeObjectURL(url);
    }, undefined, function () {
      status.textContent = 'No se pudo leer ' + file.name + '. Probá con un PNG, JPG o WebP.';
      URL.revokeObjectURL(url);
    });
    e.target.value = '';
  });
  document.getElementById('texReset').addEventListener('click', function () {
    setTexture(makeDefaultTexture());
    status.textContent = 'Textura de prueba.';
  });

  var toggle = document.getElementById('toggle'), body = document.getElementById('panelBody');
  function setOpen(open) {
    body.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    toggle.textContent = open ? 'Ocultar' : 'Mostrar';
  }
  toggle.addEventListener('click', function () { setOpen(body.hidden); });
  if (window.matchMedia && window.matchMedia('(max-width: 520px)').matches) setOpen(false);

  /* ---------- Cámara: mirar arrastrando ---------- */
  var dragging = false, lastX = 0, lastY = 0;
  stage.addEventListener('pointerdown', function (e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    stage.classList.add('dragging');
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    yaw -= (e.clientX - lastX) * 0.004;
    pitch -= (e.clientY - lastY) * 0.004;
    pitch = Math.max(-1.5, Math.min(1.5, pitch));
    lastX = e.clientX; lastY = e.clientY;
  });
  function endDrag() { dragging = false; stage.classList.remove('dragging'); }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  /* ---------- Cámara: moverse con WASD ---------- */
  var keys = {};
  var speed = 6;
  var speedOut = document.getElementById('speedOut');
  var MOVE = { KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1, Space: 1, ShiftLeft: 1, ShiftRight: 1 };

  window.addEventListener('keydown', function (e) {
    if (!MOVE[e.code]) return;
    var a = document.activeElement;
    if (a && a !== document.body && a.blur) a.blur();
    keys[e.code === 'ShiftRight' ? 'ShiftLeft' : e.code] = true;
    e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    delete keys[e.code === 'ShiftRight' ? 'ShiftLeft' : e.code];
  });
  window.addEventListener('blur', function () { keys = {}; });

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    speed = Math.max(1, Math.min(60, speed * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
    speedOut.textContent = speed < 10 ? speed.toFixed(1) : Math.round(speed);
  }, { passive: false });

  document.querySelectorAll('#pad button').forEach(function (b) {
    var k = b.getAttribute('data-key');
    b.addEventListener('pointerdown', function (e) { keys[k] = true; try { b.setPointerCapture(e.pointerId); } catch (err) {} });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) {
      b.addEventListener(ev, function () { delete keys[k]; });
    });
  });

  /* ---------- Tamaño y bucle ---------- */
  function resize() {
    var w = stage.clientWidth || 1, h = stage.clientHeight || 1;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  setTexture(makeDefaultTexture());

  var last = performance.now();
  function frame(now) {
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;

    var cp = Math.cos(pitch), sp = Math.sin(pitch), sy = Math.sin(yaw), cy = Math.cos(yaw);
    var fx = -sy * cp, fy = sp, fz = -cy * cp;
    var rx = cy, rz = -sy;
    var mx = 0, my = 0, mz = 0;
    if (keys.KeyW) { mx += fx; my += fy; mz += fz; }
    if (keys.KeyS) { mx -= fx; my -= fy; mz -= fz; }
    if (keys.KeyD) { mx += rx; mz += rz; }
    if (keys.KeyA) { mx -= rx; mz -= rz; }
    if (keys.Space) my += 1;
    if (keys.ShiftLeft) my -= 1;
    var len = Math.sqrt(mx * mx + my * my + mz * mz);
    if (len > 0) {
      var s = speed * dt / len;
      camera.position.x += mx * s;
      camera.position.y += my * s;
      camera.position.z += mz * s;
    }
    camera.rotation.set(pitch, yaw, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
