<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coronda · Modo desarrollador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dev.css">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<div class="app">
  <div id="stage" aria-label="Escena 3D"></div>

  <button id="inspectToggle" class="inspect-toggle" type="button" aria-pressed="true">Inspector: activado (I)</button>
  <div class="crosshair" id="crosshair" aria-hidden="true"></div>
  <aside class="inspector" id="inspector" aria-live="polite" aria-label="Información del objeto"></aside>

  <div class="loading" id="loading" aria-live="polite" hidden></div>

  <div class="hint" id="hint">
    <span id="hintFree"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> mover · <kbd>Espacio</kbd> subir · <kbd>Shift</kbd> bajar · arrastrar para mirar · <kbd>I</kbd> inspector · <kbd>C</kbd> personaje · rueda para la velocidad (<b id="speedOut">6</b> m/s)</span>
    <span id="hintPlayer" hidden><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> mover · <kbd>Shift</kbd> correr · arrastrar para girar la cámara · rueda para el zoom · <kbd>E</kbd> interactuar · <kbd>I</kbd> inspector · <kbd>C</kbd> cámara libre/personaje</span>
  </div>

  <div class="pad" id="pad" aria-label="Controles táctiles">
    <button type="button" data-key="Space" aria-label="Subir">▲</button>
    <button type="button" data-key="KeyW" aria-label="Adelante">W</button>
    <button type="button" data-key="ShiftLeft" aria-label="Bajar">▼</button>
    <button type="button" data-key="KeyA" aria-label="Izquierda">A</button>
    <button type="button" data-key="KeyS" aria-label="Atrás">S</button>
    <button type="button" data-key="KeyD" aria-label="Derecha">D</button>
  </div>
</div>

<script type="module" src="src/dev.js"></script>
</body>
</html>
