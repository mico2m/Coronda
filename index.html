<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coronda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<div class="app">
  <div id="stage" aria-label="Escena 3D"></div>

  <div class="loading" id="loading" aria-live="polite" hidden></div>

  <!-- Pantalla de carga: se ve apenas abre la página (ver src/ui/boot.js) -->
  <div class="boot" id="boot" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-title">Coronda</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-text">Cargando…</div>
      <div class="boot-tip">La primera vez puede tardar unos segundos.</div>
    </div>
  </div>
  <noscript><div class="boot">Coronda necesita JavaScript activado.</div></noscript>


  <!-- Solo en celular/tablet (css: pointer coarse) -->
  <div class="pad" id="pad" aria-label="Controles táctiles"></div> <!-- el joystick lo arma src/ui/touch-controls.js -->
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
