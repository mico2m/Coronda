<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coronda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<div class="app">
  <div id="stage" aria-label="Escena 3D"></div>

  <div class="loading" id="loading" aria-live="polite" hidden></div>


  <!-- Solo en celular/tablet (css: pointer coarse) -->
  <div class="pad" id="pad" aria-label="Controles táctiles">
    <button type="button" data-key="KeyW" aria-label="Adelante" style="grid-column: 2">W</button>
    <button type="button" data-key="KeyA" aria-label="Izquierda">A</button>
    <button type="button" data-key="KeyS" aria-label="Atrás">S</button>
    <button type="button" data-key="KeyD" aria-label="Derecha">D</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
